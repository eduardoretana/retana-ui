spec_id: retana-ui-idea450b
head: 2f8d20198685d27718828101bca31490a619bfc6
profile: STANDARD
rules:
  - id: RUI-GLASS-001
    statement: "backdrop-blur solo en superficies flotantes, con fallback opaco, reduced-transparency y blur estático menor de 20px."
    req_ids: [AC-2]
  - id: RUI-BADGE-001
    statement: "El tono neutro es solo para conteos informativos. El número es texto o aria-label. Contraste de componente ≥3:1."
    req_ids: [AC-3]
  - id: RUI-RADIUS-001
    statement: "Los pasos sm…4xl son valores fijos, sin multiplicar --radius. El 1:1 sigue en rounded-full."
    req_ids: [AC-5]
  - id: RUI-CONTRAST-001
    statement: "Texto del fallback ≥4.5:1. El badge y el punto ≥3:1 contra el fondo en claro y oscuro."
    req_ids: [AC-2, AC-3]
  - id: RUI-ANIM-PERF-001
    statement: "La fila circle solo anima opacity y transform. No hay transition-all nuevo ni blur animado."
    req_ids: [AC-6]
  - id: RUI-ANIM-PERF-004
    statement: "El blur de glass es estático y menor de 20px."
    req_ids: [AC-2, AC-6]
  - id: WCAG-1.4.1
    statement: "El número del conteo no depende solo del color."
    req_ids: [AC-3]
  - id: WCAG-1.4.3
    statement: "El número visible del badge count contrasta ≥4.5:1 con su fondo."
    req_ids: [AC-3]
  - id: WCAG-1.4.11
    statement: "El punto y el badge neutros contrastan ≥3:1 con el fondo adyacente."
    req_ids: [AC-3]
  - id: WCAG-2.2-AA
    statement: "axe sin serious ni critical en el círculo y el badge."
    req_ids: [AC-4, AC-6]
req_ids: [AC-1, AC-2, AC-3, AC-4, AC-5, AC-6]
