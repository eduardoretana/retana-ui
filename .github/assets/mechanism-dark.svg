<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How a Retana UI piece inherits the host</title>
  <desc id="desc">Three steps. The host already has light and dark tokens. Install with npx shadcn add @retana/name, and keep the host primitives. The piece then reads semantic classes such as bg-background and ships no palette.</desc>
  <rect x="1" y="1" width="1198" height="398" rx="28" fill="#0C0C0E" stroke="#27272A"/>
  <g id="motif" fill="none" stroke="#FAFAFA" stroke-width="1.5">
    <path d="M44 32 H64 M44 32 V52"/>
    <path d="M1156 32 H1136 M1156 32 V52"/>
    <path d="M44 368 H64 M44 368 V348"/>
    <path d="M1156 368 H1136 M1156 368 V348"/>
  </g>
  <g id="host" transform="translate(56 48)">
    <rect width="336" height="304" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="24" y="44" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">01</text>
    <text x="24" y="86" fill="#FAFAFA" font-size="34" font-weight="650">Host</text>
    <text x="24" y="128" fill="#E4E4E7" font-size="20">The project already has</text>
    <text x="24" y="156" fill="#E4E4E7" font-size="20">its own light and dark.</text>
    <g id="swatch-light">
      <rect x="24" y="188" width="138" height="84" rx="10" fill="#FFFFFF" stroke="#D4D4D8"/>
      <text x="93" y="236" fill="#18181B" font-size="20" text-anchor="middle">Light</text>
    </g>
    <g id="swatch-dark">
      <rect x="174" y="188" width="138" height="84" rx="10" fill="#09090B" stroke="#3F3F46"/>
      <text x="243" y="236" fill="#FAFAFA" font-size="20" text-anchor="middle">Dark</text>
    </g>
  </g>
  <g id="install" transform="translate(432 48)">
    <rect width="336" height="304" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <text x="24" y="44" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">02</text>
    <text x="24" y="86" fill="#FAFAFA" font-size="34" font-weight="650">Install</text>
    <text x="24" y="128" fill="#E4E4E7" font-size="20">New files only.</text>
    <text x="24" y="156" fill="#E4E4E7" font-size="20">Host primitives stay.</text>
    <rect x="24" y="184" width="288" height="88" rx="10" fill="#0C0C0E" stroke="#3F3F46"/>
    <text x="40" y="220" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">npx shadcn@latest</text>
    <text x="40" y="248" fill="#FAFAFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">add @retana/name</text>
  </g>
  <g id="inherit" transform="translate(808 48)">
    <rect width="336" height="304" rx="16" fill="#18181B" stroke="#3F3F46"/>
    <g id="piece-crop" fill="none" stroke="#FAFAFA" stroke-width="1.5">
      <path d="M16 16 H32 M16 16 V32"/>
      <path d="M320 16 H304 M320 16 V32"/>
      <path d="M16 288 H32 M16 288 V272"/>
      <path d="M320 288 H304 M320 288 V272"/>
    </g>
    <text x="24" y="44" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">03</text>
    <text x="24" y="86" fill="#FAFAFA" font-size="34" font-weight="650">Inherit</text>
    <text x="24" y="128" fill="#E4E4E7" font-size="20">Reads the host classes.</text>
    <text x="24" y="156" fill="#E4E4E7" font-size="20">Ships no palette.</text>
    <rect x="24" y="188" width="138" height="84" rx="10" fill="#FAFAFA"/>
    <text x="93" y="236" fill="#18181B" font-size="20" text-anchor="middle">Button</text>
    <rect x="174" y="188" width="138" height="84" rx="10" fill="#18181B" stroke="#A1A1AA"/>
    <text x="243" y="236" fill="#FAFAFA" font-size="20" text-anchor="middle">Peek</text>
  </g>
</svg>
